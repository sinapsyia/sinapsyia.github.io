<title>Diagnóstico IA Sinapsy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one narrow column of steps under a sticky progress bar; the result widens to matrix + quadrant lists. Dark-only, matching the SinapsyIA brand. */
:root{
  --bg:#0B1020; --surface:#11182F; --surface-2:#18213F; --line:rgba(160,170,230,.16); --line-strong:rgba(160,170,230,.32);
  --fg:#E9ECFB; --muted:#9BA3C6; --faint:#6B739A;
  --violet:#8B5CF6; --violet-deep:#7C3AED; --cyan:#22D3EE;
  --int:#34D399; --ext:#FB923C; --warn:#FBBF24; --danger:#F87171;
  --q-win:#22D3EE; --q-moon:#A78BFA; --q-fill:#8B93B8; --q-avoid:#F59E0B;
  --grad:linear-gradient(135deg,#7C3AED 0%,#06B6D4 100%);
  --display:'Poppins',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
.wrap.wide{max-width:1080px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);font-weight:600}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,16,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:16px}
.brand svg{flex:none}
.steps{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.st{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.st b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;border:1px solid var(--line-strong);font-weight:600}
.st.on{color:var(--fg)} .st.on b{background:var(--grad);border-color:transparent;color:#fff}
.st.done b{background:var(--surface-2);color:var(--cyan);border-color:var(--cyan)}
.st + .st::before{content:"";width:14px;height:1px;background:var(--line-strong);margin-right:2px}
.mode{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--line-strong);color:var(--muted)}
.mode.ia{border-color:rgba(34,211,238,.5);color:var(--cyan)}

main{padding-top:36px;display:flex;flex-direction:column;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.notice{border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.07);color:#FDE68A;border-radius:10px;padding:10px 14px;font-size:13.5px}

/* hero */
.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero p.lead{font-size:17px;color:var(--muted);max-width:60ch}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px;padding:0;list-style:none;counter-reset:how}
.how li{counter-increment:how;border-top:1px solid var(--line-strong);padding-top:10px;font-size:13.5px;color:var(--muted)}
.how li::before{content:counter(how);display:block;font-family:var(--display);font-weight:600;color:var(--fg);font-size:14px;margin-bottom:2px}
.how li strong{color:var(--fg);font-weight:600}
@media (max-width:620px){.how{grid-template-columns:1fr}}

/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],select,textarea,input[type=number]{background:var(--bg);border:1px solid var(--line-strong);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--grad);color:#fff;font-family:var(--display);font-size:14.5px;letter-spacing:.01em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--fg);font-family:var(--body);font-weight:500}
.btn.ghost:hover{border-color:var(--muted)}
.btn.sm{padding:8px 12px;font-size:13px}
.linkbtn{background:none;border:0;color:var(--cyan);cursor:pointer;padding:0;font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding-top:4px}
.err{color:var(--danger);font-size:13px}

/* busy */
.busy{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.busy small{display:block;color:var(--faint);font-size:12.5px}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--cyan);animation:sp 0.9s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* summary quote */
.reading{border-left:3px solid var(--violet);padding:4px 0 4px 14px;font-size:16px}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.chip{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--bg);cursor:pointer}
.chip .n{font-weight:600}
.chip .d{font-size:12.5px;color:var(--muted)}
.chip[aria-pressed=true]{border-color:var(--cyan);background:rgba(34,211,238,.08);box-shadow:inset 0 0 0 1px var(--cyan)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}

/* checklist */
.checks{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--bg)}
.checks label:last-child{border-bottom:0}
.checks input{margin-top:3px;accent-color:var(--cyan);width:17px;height:17px;flex:none}
.checks label.off span{color:var(--faint);text-decoration:line-through}

/* classification rows */
.tasks{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:14px 16px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.trow .name{font-weight:600}
.trow .lev{grid-column:1/-1;color:var(--muted);font-size:13.5px}
.trow .scores{display:flex;gap:10px;align-items:end;flex-wrap:wrap}
.score{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.score input{width:64px;padding:7px 8px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
.score select{padding:7px 8px;width:auto}
.x{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:16px;line-height:1}
.x:hover{color:var(--danger);border-color:var(--danger)}
@media (max-width:560px){.trow{grid-template-columns:1fr}}

.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.I{color:var(--int);background:rgba(52,211,153,.12)}
.tag.E{color:var(--ext);background:rgba(251,146,60,.12)}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}

/* result */
.res-head{display:flex;flex-direction:column;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat .v{font-family:var(--display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.stat.win .v{color:var(--q-win)} .stat.moon .v{color:var(--q-moon)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

.matrix-wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.matrix-wrap{grid-template-columns:1fr}}
.matrix{width:100%;height:auto;display:block}
.matrix text{font-family:var(--body)}
.dot{cursor:pointer}
.dot circle.c{stroke:var(--bg);stroke-width:2}
.dot.sel circle.ring{stroke:var(--fg);stroke-width:2;fill:none}
.dot:focus{outline:none}
.dot:focus-visible circle.ring{stroke:var(--cyan);stroke-width:3}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.detail .q{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.detail .lev{font-size:16px;line-height:1.5;border-left:3px solid var(--cyan);padding-left:12px}
.kv{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.kv div{display:flex;flex-direction:column}
.kv b{font-family:var(--display);font-size:22px}
.kv span{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}

.quads{display:flex;flex-direction:column;gap:16px}
.quad{border-radius:var(--r);padding:20px;border:1px solid var(--line);background:var(--surface)}
.quad header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.quad header p{font-size:13px;color:var(--muted)}
.quad.win{border-color:rgba(34,211,238,.45);background:linear-gradient(180deg,rgba(34,211,238,.08),rgba(124,58,237,.05) 70%),var(--surface)}
.quad.win h3{color:var(--q-win)}
.quad.moon h3{color:var(--q-moon)}
.quad.fill{background:transparent} .quad.fill h3{color:var(--q-fill)}
.quad.avoid{background:transparent;border-style:dashed} .quad.avoid h3{color:var(--q-avoid)}
.quad.fill .item,.quad.avoid .item{opacity:.85}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:4px}
.item .num{grid-row:1/3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#0B1020}
.item .top-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .top-line .nm{font-weight:600}
.item .top-line .sc{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.item .lv{color:var(--muted);font-size:14px}
.quad.win .item .lv{color:var(--fg)}
.empty{font-size:13.5px;color:var(--faint)}

.reco{border-radius:18px;padding:28px;background:var(--grad);color:#fff;display:flex;flex-direction:column;gap:12px}
.reco .eyebrow{color:rgba(255,255,255,.85)}
.reco h2{font-size:clamp(24px,4vw,32px);font-weight:700}
.reco p{max-width:65ch}
.reco .lev{background:rgba(11,16,32,.35);border-radius:12px;padding:14px 16px;font-size:15.5px}

.share textarea{min-height:160px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
.handle{font-family:var(--display);font-weight:600;user-select:all}
.saved{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.srow{display:flex;gap:10px;align-items:center;padding:10px 12px 10px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.srow:last-child{border-bottom:0}
.sopen{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;padding:4px 14px;cursor:pointer}

.prop-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;align-items:start}

.pitem:last-child{border-bottom:0}

.pi-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.pi-main .nm{font-weight:600}

.pi-side{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pi-side select{width:auto;flex:1 1 200px;padding:7px 10px;font-size:13.5px}
.pi-price{font-variant-numeric:tabular-nums;font-weight:600;min-width:80px;text-align:right}
.qb{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:99px}
.qb.win{color:var(--q-win);background:rgba(34,211,238,.12)} .qb.moon{color:var(--q-moon);background:rgba(167,139,250,.12)}

.ptot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ptot div{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}

.ptot b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.ptot small{font-size:11.5px;color:var(--muted)}
@media (max-width:480px){.ptot{grid-template-columns:1fr}}
.paper{background:#FFFFFF;color:#212538;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35);font-size:13.5px;line-height:1.55}
.paper .empty{padding:24px;color:#606680}
.pp-head{background:#0B1020;color:#fff;padding:22px 26px 18px;border-bottom:4px solid;border-image:linear-gradient(90deg,#7C3AED,#06B6D4) 1}
.pp-brand{font-size:11px;font-weight:700;letter-spacing:.14em;color:#22D3EE}
.pp-head h2{color:#fff;font-size:22px;margin:4px 0}
.pp-head p{color:#C8CDE6;font-size:12.5px}
.pp-body{padding:20px 26px 24px;display:flex;flex-direction:column;gap:8px}
.pp-body h3{font-family:var(--display);color:#0B1020;font-size:15px;margin-top:10px;padding-bottom:4px;border-bottom:2px solid #EDE9FE}
.pp-soft{color:#606680;font-size:12.5px}
.pp-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.pp-tw{overflow-x:auto}

.pp-t th{background:#7C3AED;color:#fff;text-align:left;padding:7px 9px;font-weight:600}
.pp-t td{padding:7px 9px;border-bottom:1px solid #E6E6EF;vertical-align:top}

.pp-foot{margin-top:12px;padding-top:10px;border-top:1px solid #E6E6EF;color:#606680;font-size:12px}
.svcs{display:flex;flex-direction:column;gap:12px}
.svc{display:flex;flex-direction:column;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.svc-top{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.savedbar{border:1px solid rgba(34,211,238,.35);background:rgba(34,211,238,.07);border-radius:10px;padding:10px 14px;font-size:13.5px}

</style>

function pdfSafe(s){
  return String(s==null?'':s).replace(/[–—−]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/→/g,'->').replace(/[^\x00-\xFF]/g,'');
}
function buildPdf(m){
  const J = window.jspdf && window.jspdf.jsPDF;
  if(!J) throw new Error('nolib');
  const doc = new J({unit:'mm', format:'a4'});
  if(typeof doc.autoTable!=='function') throw new Error('nolib');
  const W=210, M=18, BOT=278, ink=[33,37,56], soft=[96,102,128], violet=[124,58,237], navy=[11,16,32];
  let y=0;
  const ensure = h => { if(y+h>BOT){ doc.addPage(); y=20; } };
  const txt = (t,size,style,color,indent) => {
    doc.setFont('helvetica', style||'normal'); doc.setFontSize(size); doc.setTextColor(...(color||ink));
    const lh=size*0.45, ind=indent||0;
    doc.splitTextToSize(pdfSafe(t), W-2*M-ind).forEach(l=>{ ensure(lh+1); doc.text(l, M+ind, y); y+=lh; });
  };
  const h2 = t => { y+=5; ensure(18); doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(...navy); doc.text(pdfSafe(t),M,y); y+=2.2; doc.setDrawColor(...violet); doc.setLineWidth(0.7); doc.line(M,y,M+14,y); y+=6.5; };
  const tstyle = {font:'helvetica',fontSize:9.5,cellPadding:2.6,textColor:ink,lineColor:[225,225,238],lineWidth:0.2,valign:'middle'};
  doc.setFillColor(...navy); doc.rect(0,0,W,42,'F');
  doc.setFillColor(...violet); doc.rect(0,42,W/2,1.6,'F'); doc.setFillColor(6,182,212); doc.rect(W/2,42,W/2,1.6,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text('SINAPSYIA',M,15);
  doc.setFontSize(21); doc.text(pdfSafe('Proposta de automação com IA'),M,27);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(200,205,230);
  doc.text(pdfSafe(`Para ${m.cliente}  ·  ${m.data}  ·  válida por ${CFG.validadeDias} dias`),M,35);
  y=54;
  h2('Objetivo'); txt(m.objetivo,10.5); if(m.contexto){ y+=2; txt('Ponto de partida: '+m.contexto,10,'normal',soft); }
  h2('O que vamos entregar');
  m.lines.forEach((l,i)=>{ ensure(16); txt(`${i+1}. ${l.s.nome}${l.t?'  ·  '+l.t.nome:''}`,11,'bold'); y+=0.6;
    if(l.t&&l.t.alavanca) txt('Como a IA entra: '+l.t.alavanca,10,'normal',ink,4.5);
    if(l.s.inclui) txt('Inclui: '+l.s.inclui,10,'normal',soft,4.5); y+=3; });
  if(m.mensal) txt('A mensalidade cobre monitoramento, correções e pequenos ajustes nas soluções entregues.',9.5,'italic',soft);
  h2('Investimento');
  const head=['Serviço','Implantação']; if(m.useD) head.push('Com desconto'); head.push('Mensalidade');
  const body=m.lines.map(l=>{ const r=[pdfSafe(l.s.nome+(l.t?'\n'+l.t.nome:'')), money(l.s.impl)]; if(m.useD) r.push(money(l.s.impl*(1-CFG.desconto/100))); r.push(l.s.mensal?money(l.s.mensal):'-'); return r; });
  const foot=['Total', money(m.impl)]; if(m.useD) foot.push(money(m.implD)); foot.push(m.mensal?money(m.mensal)+'/mês':'-');
  ensure(30);
  doc.autoTable({startY:y, head:[head], body, foot:[foot], margin:{left:M,right:M,bottom:22}, theme:'grid', styles:tstyle,
    headStyles:{fillColor:violet,textColor:255,fontStyle:'bold'}, footStyles:{fillColor:[240,237,255],textColor:navy,fontStyle:'bold'},
    columnStyles:{0:{cellWidth:'auto'},1:{halign:'right',cellWidth:30},2:{halign:'right',cellWidth:32},3:{halign:'right',cellWidth:32}}, showFoot:'lastPage'});
  y=doc.lastAutoTable.finalY+5;
  if(m.useD) txt(`Desconto de lançamento de ${CFG.desconto}% sobre a implantação, válido para os primeiros clientes da SinapsyIA.`,9.5,'normal',soft);
  h2('Prazos e etapas');
  if(m.prazo){ txt(`As soluções ficam prontas em ${m.prazo} a partir do início, uma depois da outra.`,10.5); y+=1.5; }
  m.etapas.forEach((e,i)=>{ txt(`${i+1}. ${e}`,10,'normal',ink,2); y+=1.2; });
  if(m.ferr.length){
    h2('Custos de ferramentas');
    txt(`As ferramentas custam em torno de ${money(m.ferrTot)} por mês e são pagas pela sua empresa direto ao fornecedor, separadas do nosso serviço. Os valores são estimativas e serão confirmados na reunião de início.`,10.5);
    y+=2; ensure(24);
    doc.autoTable({startY:y, head:[['Ferramenta','Por mês','Para que serve']], body:m.ferr.map(f=>[pdfSafe(f.nome),money(f.valor),pdfSafe(f.desc)]), margin:{left:M,right:M,bottom:22}, theme:'grid', styles:tstyle,
      headStyles:{fillColor:[60,66,96],textColor:255,fontStyle:'bold'}, columnStyles:{0:{cellWidth:55},1:{halign:'right',cellWidth:24}}});
    y=doc.lastAutoTable.finalY+3;
  }
  h2('Condições'); m.condicoes.forEach(c=>{ txt('- '+c,10,'normal',ink,2); y+=1.2; });
  h2('Próximos passos'); m.passos.forEach((p,i)=>{ txt(`${i+1}. ${p}`,10,'normal',ink,2); y+=1.2; });
  const n=doc.getNumberOfPages();
  for(let p=1;p<=n;p++){ doc.setPage(p); doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(...soft);
    doc.text(pdfSafe('SinapsyIA  ·  '+CFG.contato),M,289); doc.text(`${p}/${n}`,W-M,289,{align:'right'}); }
  return doc.output('blob');
}

  const dl = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('downloads').catch(()=>null) : null;

  saveProp(true);
  try{ await dl.save({filename:nome, data:blob}); propMsg('PDF salvo. Confira a pasta de downloads.'); }

/* ---------- IA (capability sample) ---------- */
const samplePromise = (window.claude && typeof window.claude.use==='function')
  ? window.claude.use('sample').catch(()=>null) : Promise.resolve(null);
async function getSample(){
  if(S.mode==='guiado') return null;
  const s = await samplePromise;
  if(!s){ S.mode='guiado'; return null; }
  return s;
}
function errMsg(e){
  const c = e && e.code;
  if(c==='rate_limited') return 'A IA está com muitos pedidos agora.';
  if(c==='session_expired') return 'Sua sessão no Claude expirou.';
  if(PERMANENT.includes(c)) return 'A análise com IA não está liberada nesta visualização.';
  return 'Não consegui falar com a IA agora.';
}
async function askAI(prompt){
  const sample = await getSample();
  if(!sample) return null;
  CTL = new AbortController();
  try{
    const r = await sample.json(prompt,{signal:CTL.signal});
    if(S.mode!=='ia'){S.mode='ia';}
    return r;
  }catch(e){
    if(e && e.code==='cancelled') throw e;
    if(PERMANENT.includes(e && e.code)) S.mode='guiado';
    S.notice = errMsg(e) + ' Segui com a lista padrão da Sinapsy — você pode ajustar tudo.';
    return null;
  }
}
const str = v => (typeof v==='string'?v:'').trim();
const clamp = v => { const n=Math.round(Number(v)); return isFinite(n)?Math.max(0,Math.min(10,n)):5; };
function ctx(){
  const e=S.empresa;
  return `Empresa: ${e.nome}\nSegmento: ${e.segmento||'não informado'}\nDescrição do dono: ${e.descricao}\n${S.resumo?'Leitura confirmada: '+S.resumo+'\n':''}`;
}

/* ---------- Catálogo helpers ---------- */
function catDept(name){
  if(CAT[name]) return name;
  for(const [re,k] of DEPT_KEYS) if(re.test(name)) return k;
  return null;
}
function catTask(name){
  const n=name.toLowerCase();
  for(const k in CAT) for(const t of CAT[k].t) if(t[0].toLowerCase()===n) return t;
  return null;
}

async function run(label, fn){
  BUSY = label; FORM_ERR=''; render();

  catch(e){ if(!(e && e.code==='cancelled')){ S.notice='Algo deu errado. Tente de novo.'; } }
  BUSY = null; CTL=null; save(); render(); window.scrollTo({top:0});
}

async function submitEmpresa(){
  const e=S.empresa;
  if(!e.nome.trim()){FORM_ERR='Escreva o nome da empresa.';render();return;}
  if(e.descricao.trim().length<20){FORM_ERR='Conte um pouco mais sobre o que a empresa faz (pelo menos uma frase).';render();return;}
  S.notice='';
  await run('Lendo o seu negócio…', async ()=>{
    const r = await askAI(`Você é consultor de IA da SinapsyIA e está fazendo um diagnóstico de onde a IA pode ajudar uma empresa brasileira.

${ctx()}
Faça duas coisas:
1) "resumo": uma frase em português do Brasil, direta, começando com "Você tem", resumindo o tipo de negócio, o nicho, se é presencial ou digital e o público atendido.
2) "departamentos": de 6 a 8 áreas típicas para ESTE tipo de negócio (adaptadas a ele, não uma lista genérica). Cada uma com "nome" (até 3 palavras) e "descricao" (até 8 palavras dizendo o que cobre).

Responda só com JSON neste formato: {"resumo":"...","departamentos":[{"nome":"...","descricao":"..."}]}`);
    if(r && Array.isArray(r.departamentos) && r.departamentos.length){
      S.resumo = str(r.resumo);

    }
    S.depts=[]; S.taskOptions={}; S.chosen={}; S.tasks=[]; S.deptIdx=0;

async function goNotas(){
  const dept=S.depts[S.deptIdx], list=S.chosen[dept]||[];
  S.notice='';
  await run(`Avaliando ${list.length} tarefas de ${dept}…`, async ()=>{
    const r = await askAI(`Você é consultor de IA da SinapsyIA, avaliando onde automatizar com IA.

${ctx()}
Área: ${dept}

Para cada tarefa abaixo, avalie:
- "impacto" (inteiro 0-10): quanto automatizar move o negócio de verdade: aumenta vendas ou faturamento, reduz custo operacional, ou libera muitas horas de pessoas caras. 8-10: pode mudar o resultado financeiro do negócio. 5-7: ganho real, mas não transformador. 2-4: útil, mas pequeno. 0-1: cosmético, organizacional ou raro. Organizar arquivos, formatar documentos e tarefas raras ficam baixo.
- "esforco" (inteiro 0-10): trabalho para construir e manter a solução. Processo artesanal ou nebuloso, muitas integrações, regras condicionais e dados sensíveis aumentam. Processo padronizado diminui. Se a IA conversa direto com cliente ou lead, some 1 a 2 pontos.
- "tipo": "Interno" (roda nos bastidores, o cliente não interage) ou "Externo" (conversa direto com cliente ou lead).

Tarefas:
${list.map((t,j)=>`${j+1}. ${t}`).join('\n')}

    const arr = (r && Array.isArray(r.tarefas)) ? r.tarefas : null;

      }

      if(c) return {nome, impacto:c[1], esforco:c[2], tipo:c[3], alavanca:c[4]};

    for(const b of built){
      const prev = old.find(o=>o.nome===b.nome);

/* ---------- Quadrantes ---------- */
const QUADS = {
  win:  {k:'win',  ico:'🚀', t:'QUICK WIN',       s:'Comece aqui',     d:'Alto impacto, baixo esforço', col:'var(--q-win)'},
  moon: {k:'moon', ico:'🎯', t:'MOONSHOT',        s:'Estratégico',     d:'Alto impacto, alto esforço',  col:'var(--q-moon)'},
  fill: {k:'fill', ico:'🧩', t:'FILLER',          s:'Talvez depois',   d:'Baixo impacto, baixo esforço',col:'var(--q-fill)'},
  avoid:{k:'avoid',ico:'⚠️', t:'AVOID / DELEGAR', s:'Evitar agora',    d:'Baixo impacto, alto esforço', col:'var(--q-avoid)'}
};
function quad(t){ const hi=t.impacto>5, lo=t.esforco<5; return hi?(lo?'win':'moon'):(lo?'fill':'avoid'); }
function score(t){ return t.impacto - 0.6*t.esforco + (t.tipo==='I'?0.5:0); }
function best(arr){ return arr.slice().sort((a,b)=>score(b)-score(a))[0]; }
function recommend(){
  const ts=S.tasks; if(!ts.length) return null;
  const w=ts.filter(t=>quad(t)==='win'); if(w.length) return {t:best(w),kind:'win'};
  const m=ts.filter(t=>quad(t)==='moon'); if(m.length) return {t:best(m),kind:'moon'};
  return {t:best(ts),kind:'other'};
}
function numOf(t){ return S.tasks.indexOf(t)+1; }

/* ---------- Código de acesso ----------
   Um código por cliente, criado/editado no Painel (docs col=codigos {codigo,nome,ativo}).
   Vale nas 3 ferramentas; o banco confere (função sinapsy_codigo) e recusa envio sem código ativo.
   (criarCodigo/desativar abaixo são da versão antiga e não aparecem mais na tela.) */
const ACC_KEY='sinapsy-acesso-v3'; // igual nas 3 ferramentas e no runtime
const ACC_CHAVE='I5nwt2BAF3pvLfWvOZPIbBHy'; // igual nos dois apps
const ACC_ALFA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let ACC={ok:false,hash:null,codigo:null,checked:false,err:'',busy:false,txt:''};
let CODIGOS=null, COD_MSG='', COD_ERR=false;
function normCode(c){ return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
async function sha(s){
  const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return new Uint8Array(b);
}
async function hashCode(c){ return normCode(c); } // o código (normalizado) identifica o cliente
async function assinatura(base){ const b=await sha('sinapsyia-v2:'+ACC_CHAVE+':'+normCode(base)); return Array.from(b.slice(0,4)).map(x=>ACC_ALFA[x%ACC_ALFA.length]).join(''); }
// Conferido pelo banco (Supabase): o código existe e está ativo
async function codigoValido(c){ return (await window.SinapsyAcesso.conferir(c))===true; }
// true = desativado; false = ativo; null = não deu para conferir
async function revogado(h){ return false; } // desativar = codigoValido falso
async function initAcesso(){
  let c=null; try{ c=localStorage.getItem(ACC_KEY); }catch(e){}
  if(c && await codigoValido(c)){
    const h=await hashCode(c), rv=await revogado(h);
    if(rv===true){ try{ localStorage.removeItem(ACC_KEY); }catch(e){} }
    else { ACC.ok=true; ACC.hash=h; ACC.codigo=normCode(c); }
  }
  ACC.checked=true;
}
async function entrarCodigo(){
  if(ACC.busy) return;
  const v=ACC.txt;
  if(normCode(v).length<4){ ACC.err='Digite o código que a SinapsyIA te enviou.'; render(); return; }
  ACC.busy=true; ACC.err=''; render();
  let ok=false, rv=null, h=null;
  try{ ok=await codigoValido(v); if(ok){ h=await hashCode(v); rv=await revogado(h); } }catch(e){}
  ACC.busy=false;
  if(ok && rv!==true){ ACC.ok=true; ACC.hash=h; ACC.codigo=normCode(v); ACC.txt=''; try{ localStorage.setItem(ACC_KEY,normCode(v)); }catch(e){} }
  else ACC.err = ok ? 'Este código foi desativado. Peça um novo à SinapsyIA no Instagram @sinapsyia.' : 'Código inválido. Confira se digitou certo ou peça o seu à SinapsyIA no Instagram @sinapsyia.';
  render(); window.scrollTo({top:0});
}
function vAcesso(titulo){
  return `<section class="card stack acc">
    <span class="eyebrow">Acesso por convite</span>
    <h1>Necessita de código de verificação</h1>
    <p class="muted">Para usar o ${esc(titulo)} da SinapsyIA, digite o código de verificação que você recebeu.</p>
    <label class="f">Código de verificação<input type="text" id="acc-code" value="${esc(ACC.txt)}" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Ex.: ANA2026-K7P2" maxlength="40"></label>

  </section>`;

function baseDoNome(nome){
  const p=normCode(String(nome).normalize('NFD').replace(/[̀-ͯ]/g,'')).replace(/[0-9]/g,'').slice(0,3)||'SNP';
  const r=crypto.getRandomValues(new Uint8Array(2));
  return p+Array.from(r).map(x=>ACC_ALFA[x%ACC_ALFA.length]).join('');
}
function subscribeCodigos(onChange){
  DB.collection('codigos').onSnapshot(s=>{ CODIGOS=s.docs.map(d=>Object.assign({},d.data(),{id:d.id})); onChange(); }, ()=>{ if(CODIGOS===null){ CODIGOS=[]; onChange(); } });
}
async function criarCodigo(btn){
  const nome=str((document.getElementById('cod-nome')||{}).value), cust=str((document.getElementById('cod-codigo')||{}).value);
  if(!nome){ COD_ERR=true; COD_MSG='Escreva o nome do cliente.'; render(); return; }
  const base = cust ? normCode(cust) : baseDoNome(nome);
  if(base.length<3){ COD_ERR=true; COD_MSG='O começo do código precisa ter pelo menos 3 letras ou números.'; render(); return; }
  if(base.length>20){ COD_ERR=true; COD_MSG='Use no máximo 20 letras ou números no começo do código.'; render(); return; }
  btn.disabled=true; btn.textContent='Criando…';
  try{
    const codigo=base+'-'+await assinatura(base), h=await hashCode(codigo);
    const ex=await DB.doc('codigos_admin/'+h).get();
    if(ex.exists){ COD_ERR=true; COD_MSG=`O código ${codigo} já existe na lista.`; render(); return; }
    await DB.doc('codigos_admin/'+h).set({codigo, nome, criadoEm:Date.now()});
    try{ await DB.doc('revogados/'+h).delete(); }catch(e){}
    COD_ERR=false; COD_MSG=`Código ${codigo} criado para ${nome}. Ele vale no Diagnóstico de IA e na Criação de App. Copie e envie junto com o link.`;
  }catch(e){ COD_ERR=true; COD_MSG='Não consegui criar o código agora. Tente de novo.'; }
  render();
}
async function desativar(h, apagarDaLista){
  await DB.doc('revogados/'+h).set({em:Date.now()});
  if(apagarDaLista) await DB.doc('codigos_admin/'+h).delete();
}
async function apagarCodigo(h){
  try{ await desativar(h,true); COD_ERR=false; COD_MSG='Código desativado neste app. Para bloquear também no outro app, cole o código em "Desativar um código" no painel de lá.'; }
  catch(e){ COD_ERR=true; COD_MSG='Não consegui desativar agora. Tente de novo.'; }
  render();
}
async function desativarDigitado(btn){
  const v=str((document.getElementById('cod-off')||{}).value);
  if(!v){ COD_ERR=true; COD_MSG='Cole o código que você quer desativar.'; render(); return; }
  if(!(await codigoValido(v))){ COD_ERR=true; COD_MSG='Esse não é um código válido da SinapsyIA.'; render(); return; }
  btn.disabled=true;
  try{ const h=await hashCode(v); await desativar(h,true); COD_ERR=false; COD_MSG=`Código ${normCode(v).slice(0,-4)}-${normCode(v).slice(-4)} desativado neste app.`; }
  catch(e){ COD_ERR=true; COD_MSG='Não consegui desativar agora. Tente de novo.'; }
  render();
}
function nomeDoCodigo(h){ const c=h&&(CODIGOS||[]).find(x=>normCode(x.codigo)===h); return c?`${c.nome} (${c.codigo})`:''; }

function matrixSvg(){
  const W=560,H=540,L=48,R=14,T=14,B=46,pw=W-L-R,ph=H-T-B;
  const X=e=>L+e/10*pw, Y=i=>T+(10-i)/10*ph;
  const groups={}; S.tasks.forEach(t=>{const k=t.esforco+','+t.impacto;(groups[k]=groups[k]||[]).push(t);});
  const pos={}; Object.values(groups).forEach(g=>g.forEach((t,j)=>{
    if(g.length===1){pos[t.id]=[X(t.esforco),Y(t.impacto)];return;}
    const a=2*Math.PI*j/g.length - Math.PI/2, r=15+(g.length>4?4:0);
    pos[t.id]=[X(t.esforco)+r*Math.cos(a), Y(t.impacto)+r*Math.sin(a)];
  }));
  const qr=(x0,y0,x1,y1,c,op)=>`<rect x="${X(x0)}" y="${Y(y1)}" width="${X(x1)-X(x0)}" height="${Y(y0)-Y(y1)}" fill="${c}" fill-opacity="${op}"/>`;
  let s=`<svg class="matrix" viewBox="0 0 ${W} ${H}" role="img" aria-label="Matriz de impacto por esforço com ${S.tasks.length} tarefas">`;
  s+=qr(0,5,5,10,'#22D3EE',.09)+qr(5,5,10,10,'#A78BFA',.08)+qr(0,0,5,5,'#8B93B8',.05)+qr(5,0,10,5,'#F59E0B',.05);
  for(let v=0;v<=10;v+=1){
    s+=`<line x1="${X(v)}" y1="${T}" x2="${X(v)}" y2="${T+ph}" stroke="#A0AAE6" stroke-opacity="${v===5?0:.06}"/>`;
    s+=`<line x1="${L}" y1="${Y(v)}" x2="${L+pw}" y2="${Y(v)}" stroke="#A0AAE6" stroke-opacity="${v===5?0:.06}"/>`;
    if(v%2===0){
      s+=`<text x="${X(v)}" y="${T+ph+18}" fill="#6B739A" font-size="11" text-anchor="middle">${v}</text>`;
      s+=`<text x="${L-10}" y="${Y(v)+4}" fill="#6B739A" font-size="11" text-anchor="end">${v}</text>`;
    }
  }
  s+=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="none" stroke="#A0AAE6" stroke-opacity=".25"/>`;
  s+=`<line x1="${X(5)}" y1="${T}" x2="${X(5)}" y2="${T+ph}" stroke="#A0AAE6" stroke-opacity=".45" stroke-dasharray="4 4"/>`;
  s+=`<line x1="${L}" y1="${Y(5)}" x2="${L+pw}" y2="${Y(5)}" stroke="#A0AAE6" stroke-opacity=".45" stroke-dasharray="4 4"/>`;
  const ql=(x,y,anchor,q)=>`<text x="${x}" y="${y}" font-size="12" font-weight="700" fill="${({win:'#22D3EE',moon:'#A78BFA',fill:'#8B93B8',avoid:'#F59E0B'})[q.k]}" text-anchor="${anchor}" letter-spacing=".06em">${q.ico} ${q.t}</text>`;
  s+=ql(L+10,T+20,'start',QUADS.win)+ql(L+pw-10,T+20,'end',QUADS.moon)+ql(L+10,T+ph-10,'start',QUADS.fill)+ql(L+pw-10,T+ph-10,'end',QUADS.avoid);
  s+=`<text x="${L+pw/2}" y="${H-6}" fill="#9BA3C6" font-size="12" text-anchor="middle">Esforço para automatizar →</text>`;
  s+=`<text transform="translate(14 ${T+ph/2}) rotate(-90)" fill="#9BA3C6" font-size="12" text-anchor="middle">Impacto no negócio →</text>`;
  S.tasks.forEach(t=>{
    const [x,y]=pos[t.id], c=t.tipo==='E'?'#FB923C':'#34D399';
    s+=`<g class="dot ${S.sel===t.id?'sel':''}" data-dot="${t.id}" tabindex="0" role="button" aria-label="${esc(numOf(t)+'. '+t.nome)}"><circle class="ring" cx="${x}" cy="${y}" r="16" fill="none"/><circle class="c" cx="${x}" cy="${y}" r="12" fill="${c}"/><text x="${x}" y="${y+4}" font-size="11" font-weight="700" text-anchor="middle" fill="#0B1020" pointer-events="none">${numOf(t)}</text></g>`;
  });
  return s+'</svg>';
}

    const ts=S.tasks.filter(t=>quad(t)===k); if(!ts.length) continue;

}

/* ---------- Eventos ---------- */
function $(id){return document.getElementById(id);}
function bind(){
  const c=$('cancel'); if(c) c.onclick=()=>{ if(CTL) CTL.abort(); };
  if(S.step==='empresa'){
    ['nome','segmento','descricao'].forEach(k=>{const el=$(k); el.addEventListener('input',()=>{S.empresa[k]=el.value;save();});});
    const g=$('go'); if(g) g.onclick=submitEmpresa;
  }
  if(S.step==='areas'){
    $('back').onclick=()=>{S.step='empresa';S.notice='';save();render();};
    app.querySelectorAll('[data-dept]').forEach(b=>b.onclick=()=>{
      const n=S.deptOptions[+b.dataset.dept].nome, i=S.depts.indexOf(n);
      if(i>=0) S.depts.splice(i,1); else if(S.depts.length<3) S.depts.push(n);
      save(); render();
    });
    const add=()=>{const v=$('newdept').value.trim().slice(0,40); if(!v) return;
      if(!S.deptOptions.some(d=>d.nome.toLowerCase()===v.toLowerCase())) S.deptOptions.push({nome:v,descricao:'Adicionada por você'});
      if(S.depts.length<3 && !S.depts.includes(v)) S.depts.push(v); save(); render();};
    $('adddept').onclick=add; $('newdept').onkeydown=e=>{if(e.key==='Enter')add();};
    const g=$('go'); if(g) g.onclick=()=>{ S.tasks=S.tasks.filter(t=>S.depts.includes(t.dept)); goTarefas(0); };
  }
  if(S.step==='tarefas'){
    const dept=S.depts[S.deptIdx];
    app.querySelectorAll('[data-task]').forEach(cb=>cb.onchange=()=>{
      const t=S.taskOptions[dept][+cb.dataset.task], ch=S.chosen[dept];
      if(cb.checked){ if(!ch.includes(t)) ch.push(t); } else { const i=ch.indexOf(t); if(i>=0) ch.splice(i,1); }
      save(); render();
    });
    const add=()=>{const v=$('newtask').value.trim().slice(0,90); if(!v) return;
      if(!S.taskOptions[dept].includes(v)) S.taskOptions[dept].push(v);
      if(!S.chosen[dept].includes(v)) S.chosen[dept].push(v); save(); render(); const n=$('newtask'); if(n) n.focus();};
    $('addtask').onclick=add; $('newtask').onkeydown=e=>{if(e.key==='Enter')add();};
    const b=$('back'); if(b) b.onclick=()=>{ S.notice=''; if(S.deptIdx>0){S.deptIdx--;S.step='notas';} else S.step='areas'; save(); render(); };
    const g=$('go'); if(g) g.onclick=()=>{
      // mantém a ordem da lista original
      S.chosen[dept]=S.taskOptions[dept].filter(t=>S.chosen[dept].includes(t));
      goNotas();
    };
  }
  if(S.step==='notas'){
    app.querySelectorAll('.trow [data-f]').forEach(el=>{
      el.addEventListener('change',()=>{
        const t=S.tasks.find(x=>x.id===+el.closest('.trow').dataset.id); if(!t) return;
        if(el.dataset.f==='tipo') t.tipo=el.value; else { t[el.dataset.f]=clamp(el.value); el.value=t[el.dataset.f]; }
        save();
      });
    });
    app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
      const id=+b.dataset.rm, t=S.tasks.find(x=>x.id===id); if(!t) return;
      S.tasks=S.tasks.filter(x=>x.id!==id);
      const ch=S.chosen[t.dept]; if(ch){const i=ch.indexOf(t.nome); if(i>=0) ch.splice(i,1);}
      save(); render();
    });
    const b=$('back'); if(b) b.onclick=()=>{S.step='tarefas';S.notice='';save();render();};
    const g=$('go'); if(g) g.onclick=goNext;
  }
  if(S.step==='resultado'){
    const pick=id=>{ S.sel=id; save();
      app.querySelectorAll('.dot').forEach(d=>d.classList.toggle('sel',+d.dataset.dot===id));
      $('detail').innerHTML=detailHtml(S.tasks.find(t=>t.id===id)); };
    app.querySelectorAll('.dot').forEach(d=>{
      d.addEventListener('click',()=>pick(+d.dataset.dot));
      d.addEventListener('mouseenter',()=>pick(+d.dataset.dot));
      d.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(+d.dataset.dot);}});
    });
    $('copy').onclick=()=>{
      const txt=shareText(), box=$('sharebox'), msg=$('copymsg');
      const fallback=()=>{box.hidden=false;box.focus();box.select();msg.textContent='Selecionei o texto abaixo: copie com Ctrl+C (ou segure e toque em Copiar no celular).';};
      try{
        navigator.clipboard.writeText(txt).then(()=>{msg.textContent='Copiado. Agora é só colar na conversa com a @sinapsyia no Instagram.';},fallback);
      }catch(e){fallback();}
    };
    const en=$('enviar'); if(en) en.onclick=async()=>{
      const msg=$('copymsg'); en.disabled=true; en.textContent='Enviando…';
      try{
        if(!DB) throw new Error('sem banco');
        await DB.collection('diagnosticos').add(docFromPayload(packObj(),'enviado pelo site'));
        S.enviado=true; save(); en.textContent='Enviado ✓';
        msg.textContent='Recebemos o seu diagnóstico! A SinapsyIA vai falar com você em breve.';
      }catch(e){
        en.disabled=false; en.textContent='Tentar enviar de novo';
        msg.textContent='Não consegui enviar agora. Tente de novo, ou toque em Copiar diagnóstico e mande no Instagram.';
      }
    };
    $('back').onclick=()=>{S.deptIdx=S.depts.length-1;S.step='notas';S.enviado=false;save();render();};
    const tp=$('topanel'); if(tp) tp.onclick=()=>{S.step='painel';PANEL_MSG='';save();render();window.scrollTo({top:0});};
    const sv=$('savebtn'); if(sv) sv.onclick=async()=>{
      const msg=$('savemsg'); sv.disabled=true; msg.textContent='Salvando…';
      try{
        const doc=docFromPayload(packObj(), S.savedOrigem||'feito por você');
        if(S.savedId){ delete doc.criadoEm; delete doc.data; doc.atualizadoEm=Date.now(); await DB.collection('diagnosticos').doc(S.savedId).update(doc); }
        else { const ref=DB.collection('diagnosticos').doc(); await ref.set(doc); S.savedId=ref.id; S.savedOrigem=doc.origem; S.savedData=fmtDate(doc); save(); }
        msg.textContent='Salvo em Meus diagnósticos.'; sv.textContent='Atualizar no painel';
      }catch(e){ msg.textContent=dbErr(e); }
      sv.disabled=false;
    };
    $('restart').onclick=()=>{
      const b=$('restart');
      if(b.dataset.confirm){ S=fresh(); save(); render(); window.scrollTo({top:0}); }
      else { b.dataset.confirm='1'; b.textContent='Toque de novo para apagar e recomeçar'; }
    };
  }
  if(S.step==='painel'){
    const ib=$('importbox'); ib.addEventListener('input',()=>{IMPORT_TXT=ib.value;});
    $('back').onclick=()=>{ S.step=S.prevStep&&S.prevStep!=='painel'?S.prevStep:'empresa'; PANEL_MSG=''; save(); render(); window.scrollTo({top:0}); };
    $('import').onclick=async()=>{
      const p=unpack(IMPORT_TXT);
      if(!p){ PANEL_ERR=true; PANEL_MSG='Não encontrei o código do diagnóstico nesse texto. Peça para o cliente tocar em "Copiar diagnóstico" de novo e colar a mensagem inteira.'; render(); return; }
      const b=$('import'); b.disabled=true; b.textContent='Salvando…';
      try{
        await DB.collection('diagnosticos').add(docFromPayload(p,'enviado pelo cliente'));
        IMPORT_TXT=''; PANEL_ERR=false; PANEL_MSG=`Diagnóstico de ${str(p.e[0])||'cliente'} salvo.`;
      }catch(e){ PANEL_ERR=true; PANEL_MSG=dbErr(e); }
      render();
    };
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ const d=(DIAGS||[]).find(x=>x.id===b.dataset.open); if(d) openSaved(d); });
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!b.dataset.confirm){ b.dataset.confirm='1'; b.textContent='Confirmar'; return; }
      b.disabled=true;
      try{ await DB.collection('diagnosticos').doc(b.dataset.del).delete(); }
      catch(e){ PANEL_ERR=true; PANEL_MSG='Não consegui apagar agora. Tente de novo.'; render(); }
    });
    app.querySelectorAll('[data-prop]').forEach(b=>b.onclick=()=>{ const d=(DIAGS||[]).find(x=>x.id===b.dataset.prop); if(d) openProposta(d); });
    $('toprecos').onclick=goPrecos;
  }
  if(S.step==='proposta' && PROP){
    const upd=()=>{ const m=propModel(); $('paper').innerHTML=paperHtml(m); };
    $('pcli').addEventListener('input',e=>{ PROP.cliente=e.target.value; upd(); });
    app.querySelectorAll('[data-pi]').forEach(cb=>cb.onchange=()=>{ PROP.itens[+cb.dataset.pi].on=cb.checked; render(); });
    app.querySelectorAll('[data-ps]').forEach(sel=>sel.onchange=()=>{ PROP.itens[+sel.dataset.ps].servico=sel.value; render(); });
    app.querySelectorAll('[data-prm]').forEach(b=>b.onclick=()=>{ PROP.itens.splice(+b.dataset.prm,1); render(); });
    $('addsvcbtn').onclick=()=>{ const v=$('addsvc').value; if(v){ PROP.itens.push({task:null,servico:v,on:true}); render(); } };

    $('ppdf').onclick=downloadPdf;
    $('pcopy').onclick=copyProp;
    $('psave').onclick=()=>saveProp(false);
    $('back').onclick=()=>{ S.step='painel'; PROP=null; save(); render(); window.scrollTo({top:0}); };
    $('toprecos2').onclick=goPrecos;
  }
  if(S.step==='precos' && CFG_EDIT){
    app.querySelectorAll('[data-cf]').forEach(el=>{
      const ev = el.tagName==='SELECT' || el.type==='checkbox' ? 'change' : 'input';
      el.addEventListener(ev,()=>{
        let v = el.dataset.bool ? el.checked : el.dataset.num ? num(el.value,0) : el.value;
        setPath(CFG_EDIT, el.dataset.cf, v); CFG_MSG=''; const m=$('cfmsg'); if(m) m.textContent='Alterações não salvas.';
      });
    });
    app.querySelectorAll('[data-csrm]').forEach(b=>b.onclick=()=>{
      if(CFG_EDIT.servicos.length<=1) return;
      if(!b.dataset.confirm){ b.dataset.confirm='1'; b.textContent='?'; b.title='Toque de novo para remover'; return; }
      CFG_EDIT.servicos.splice(+b.dataset.csrm,1); render();
    });
    $('csadd').onclick=()=>{ CFG_EDIT.servicos.push({id:'c'+Date.now().toString(36),nome:'Novo serviço',impl:0,mensal:0,prazo:'',inclui:'',whatsapp:false}); render(); };
    $('back').onclick=()=>{ CFG_EDIT=null; S.step = PROP ? 'proposta' : 'painel'; save(); render(); window.scrollTo({top:0}); };
    $('cfsave').onclick=async()=>{
      const b=$('cfsave'); b.disabled=true; $('cfmsg').textContent='Salvando…';
      try{ const c=normCfg(CFG_EDIT); await DB.doc('config/precos').set(c); CFG=c; CFG_EDIT=clone(c); CFG_MSG='Preços salvos.'; render(); }
      catch(e){ $('cfmsg').textContent=dbErr(e); b.disabled=false; }
    };
  }
}

render();
samplePromise.then(s=>{ if(!s && S.mode!=='guiado'){ S.mode='guiado'; save(); renderTop(); } });
})();
</script>

</body></html>
